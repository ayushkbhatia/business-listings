name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Every job that builds or runs the app needs a database. The home page and the
# sitemap are prerendered, both read from Postgres, and the whole public
# surface is server-rendered from seed data — a CI run without a database
# proves nothing about any of it.
env:
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
  DIRECT_URL: postgresql://postgres:postgres@localhost:5432/postgres
  NEXT_PUBLIC_SUPABASE_URL: https://irywaycgqjeeoklfmzzd.supabase.co
  NEXT_PUBLIC_SITE_URL: http://localhost:3000

  # Real keys, so the acceptance job can sign a seller in and cover /dashboard.
  # The development seat is inert under `next start` — deliberately — so a
  # signed-in session is the only way those five screens get a browser test.
  # Both are repository secrets; neither is ever printed.
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
  SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - uses: actions/checkout@v4

      # Version comes from package.json#packageManager.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The PostgREST lockdown migration revokes from Supabase's `anon` and
      # `authenticated` roles. They do not exist on a stock Postgres, so CI
      # creates them rather than the migration being weakened to suit CI.
      - name: Create the Supabase roles the lockdown migration expects
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "CREATE ROLE anon NOLOGIN;"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "CREATE ROLE authenticated NOLOGIN;"

      - name: Migrate and seed
        run: |
          pnpm exec prisma migrate deploy
          pnpm db:seed

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Tokens and strings
        run: pnpm check:tokens

      - name: Schema invariants
        run: pnpm check:schema

      - name: Formatter coverage
        run: pnpm check:formatters

      - name: Unit tests
        run: pnpm test

      # These talk to the postgres service above. They are the proof for
      # acceptance criterion 2 — a seller cannot retrieve the buyer's contact
      # details before acceptance — which the README asks to be shown at the
      # query layer rather than by inspecting a template.
      - name: Integration tests
        run: pnpm test:integration

      - name: Build
        run: pnpm build

  acceptance:
    # Named for the slice it runs, so a red check says which one.
    name: acceptance (${{ matrix.shard }})
    runs-on: ubuntu-latest

    #
    # No `needs: verify`.
    #
    # The two jobs are independent — acceptance consumes nothing verify
    # produces, it builds the app itself. Chaining them made the pipeline
    # additive: 5m35s of verify, then three seconds later, fifteen minutes of
    # acceptance. Running them together costs nothing and returns that 5m35s.
    #
    # A red verify no longer cancels acceptance, which is the small price and
    # arguably the better behaviour: two independent answers beat one answer and
    # a cancellation.
    #
    strategy:
      # Every shard reports. One failing slice must not hide the other two —
      # that turns one red run into three round trips.
      fail-fast: false
      matrix:
        include:
          #
          # The split is drawn where the auth boundary is, not where the test
          # counts are even.
          #
          # Every signed-in project depends on the `setup` project, and setup
          # provisions seats against the **shared** Supabase auth project — one
          # magic link per seat, invalidated when the next is generated. Two
          # shards running setup at the same time would be two jobs asking for
          # the same link and each invalidating the other's, which is a new
          # flake source in exchange for a faster pipeline.
          #
          # So the public projects, which touch no auth at all, split freely;
          # everything that signs in stays in one shard behind one setup.
          #
          - shard: chromium
            projects: --project=chromium
          - shard: mobile
            projects: --project=mobile
          - shard: signed-in
            projects: >-
              --project=seller --project=seller-free
              --project=staff --project=staff-moderator --project=staff-finance

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Create the Supabase roles the lockdown migration expects
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "CREATE ROLE anon NOLOGIN;"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "CREATE ROLE authenticated NOLOGIN;"

      - name: Migrate and seed
        run: |
          pnpm exec prisma migrate deploy
          pnpm db:seed

      - name: Install Playwright chromium
        run: pnpm exec playwright install --with-deps chromium

      # Acceptance criterion 8 of handoff 0, criterion 10 of handoff 1 and
      # criterion 11 of handoff 2. The Playwright config builds and starts the
      # app itself.
      #
      # `seller` runs the /dashboard specs as a genuinely signed-in seller; its
      # setup project provisions one against the real Supabase project. It is
      # registered only when the keys are present, so a fork without them gets
      # a smaller suite that says so rather than a failing one.
      #
      # `mobile` was missing here until handoff 2's acceptance pass, and four
      # specs had been red across six merged PRs because nothing in CI ever ran
      # them — one of them a wizard whose Continue button could not be pressed
      # on a phone. It is the same chromium binary with a Pixel 7 descriptor,
      # so the install step above already covers it.
      #
      # The three `staff` projects were missing here for the same reason and
      # cost the same thing. 142 tests never ran in CI, so the least-exercised
      # surface was also the one holding eight audited services that no screen
      # ever called and one screen whose capability gate was dead code. The
      # projects existed the whole time; this line did not name them.
      - name: Axe and the acceptance surface
        run: pnpm test:e2e ${{ matrix.projects }}

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          # One name per shard, or the three uploads collide and only one
          # report survives — the one you did not need.
          name: playwright-report-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 7
