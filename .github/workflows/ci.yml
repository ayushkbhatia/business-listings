name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Every job that builds or runs the app needs a database. The home page and the
# sitemap are prerendered, both read from Postgres, and the whole public
# surface is server-rendered from seed data — a CI run without a database
# proves nothing about any of it.
env:
  # `supabase start` — see supabase/config.toml. Postgres on 54322, auth and the
  # rest of the API on 54321.
  DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
  DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
  NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
  NEXT_PUBLIC_SITE_URL: http://localhost:3000

  # The CLI's fixed local keys. They are identical on every machine that runs
  # `supabase start` and authenticate against nothing but a container on this
  # runner, so they are values, not secrets — printing one costs nothing.
  #
  # They replace two repository secrets that pointed at the production project.
  # CI used to build the app against a disposable database and provision **auth**
  # against production: `createProvisionalIdentity` minted a real auth user for
  # every enquiry a test sent, the profile row that belongs beside it died with
  # the container, and `auth-flow.test.ts` cleaned up after itself by scanning
  # the first 200 users — which quietly stopped covering the project once it held
  # more than 200. 240 orphaned users had collected by 2026-09-03. When that list
  # crossed 200 the e2e seat lookup stopped finding its seats on page one and all
  # five setup projects failed, taking 267 tests with them.
  #
  # A fork gets the full suite now, rather than the reduced one it got when these
  # were secrets it could not read.
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ACJWlzQHlZjBrEguHvfOxg_3BJgxAaH
  SUPABASE_SECRET_KEY: sb_secret_N7UND0UgjKTVK-Uodkm0Hg_xSvEMPvz

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      # Full history. `check:migrations` diffs this branch against the commit it
      # left `main` at, and the default depth-1 clone has no such commit. The
      # repo is small enough that fetching all of it is not worth measuring.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Version comes from package.json#packageManager.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Brings up Postgres, GoTrue and Storage on this runner. The stack is the
      # reason the roles above are no longer created by hand: `anon` and
      # `authenticated` ship with the Supabase image, so the lockdown migration
      # meets the roles it was written against rather than ones CI invented.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.115.0

      - name: Start Supabase
        run: supabase start

      - name: Migrate and seed
        run: |
          pnpm exec prisma migrate deploy
          pnpm db:seed

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Tokens and strings
        run: pnpm check:tokens

      - name: Vocabulary and identity
        run: pnpm check:vocabulary

      - name: Table markup
        run: pnpm check:markup

      - name: Schema invariants
        run: pnpm check:schema

      # A PR that adds a migration has to name it. `prisma migrate deploy`
      # applies every pending migration rather than the caller's, so whoever
      # deploys next inherits this one — and can only review it if the merge
      # commit says it is there. See docs/deployments.md.
      #
      # The title and body arrive through the environment rather than through
      # `${{ }}` inside `run:`. Both are text a PR author controls, and
      # interpolating them into a shell command is how that becomes an
      # execution. `github.event_name` gates the step because a push to `main`
      # has no pull request to read.
      - name: Migrations are declared
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: pnpm check:migrations

      - name: Formatter coverage
        run: pnpm check:formatters

      - name: Unit tests
        run: pnpm test

      # These talk to the postgres service above. They are the proof for
      # acceptance criterion 2 — a seller cannot retrieve the buyer's contact
      # details before acceptance — which the README asks to be shown at the
      # query layer rather than by inspecting a template.
      - name: Integration tests
        run: pnpm test:integration

      - name: Build
        run: pnpm build

  acceptance:
    # Named for the slice it runs, so a red check says which one.
    name: acceptance (${{ matrix.shard }})
    runs-on: ubuntu-latest

    #
    # No `needs: verify`.
    #
    # The two jobs are independent — acceptance consumes nothing verify
    # produces, it builds the app itself. Chaining them made the pipeline
    # additive: 5m35s of verify, then three seconds later, fifteen minutes of
    # acceptance. Running them together costs nothing and returns that 5m35s.
    #
    # A red verify no longer cancels acceptance, which is the small price and
    # arguably the better behaviour: two independent answers beat one answer and
    # a cancellation.
    #
    strategy:
      # Every shard reports. One failing slice must not hide the other two —
      # that turns one red run into three round trips.
      fail-fast: false
      matrix:
        include:
          #
          # The split is drawn where the auth boundary is, not where the test
          # counts are even.
          #
          # Every signed-in project depends on the `setup` project, and setup
          # provisions seats — one magic link per seat, invalidated when the
          # next is generated. Two shards running setup against one auth
          # instance would each invalidate the other's link.
          #
          # That instance is now this job's own, so the shards no longer share
          # anything and this split could be redrawn on test count instead. It
          # is left as it is here to keep one change to one thing; the reason it
          # was drawn this way is gone.
          #
          # So the public projects, which touch no auth at all, split freely;
          # everything that signs in stays in one shard behind one setup.
          #
          - shard: chromium
            projects: --project=chromium
          - shard: mobile
            projects: --project=mobile
          - shard: signed-in
            projects: >-
              --project=seller --project=seller-free --project=seller-services
              --project=staff --project=staff-moderator --project=staff-finance

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Brings up Postgres, GoTrue and Storage on this runner. The stack is the
      # reason the roles above are no longer created by hand: `anon` and
      # `authenticated` ship with the Supabase image, so the lockdown migration
      # meets the roles it was written against rather than ones CI invented.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.115.0

      - name: Start Supabase
        run: supabase start

      - name: Migrate and seed
        run: |
          pnpm exec prisma migrate deploy
          pnpm db:seed

      - name: Install Playwright chromium
        run: pnpm exec playwright install --with-deps chromium

      # Acceptance criterion 8 of handoff 0, criterion 10 of handoff 1 and
      # criterion 11 of handoff 2. The Playwright config builds and starts the
      # app itself.
      #
      # `seller` runs the /dashboard specs as a genuinely signed-in seller; its
      # setup project provisions one against the stack this job started. The
      # projects register only when the keys are present, and the keys are now
      # fixed values rather than repository secrets — so a fork gets the whole
      # suite instead of the reduced one it used to get.
      #
      # `mobile` was missing here until handoff 2's acceptance pass, and four
      # specs had been red across six merged PRs because nothing in CI ever ran
      # them — one of them a wizard whose Continue button could not be pressed
      # on a phone. It is the same chromium binary with a Pixel 7 descriptor,
      # so the install step above already covers it.
      #
      # The three `staff` projects were missing here for the same reason and
      # cost the same thing. 142 tests never ran in CI, so the least-exercised
      # surface was also the one holding eight audited services that no screen
      # ever called and one screen whose capability gate was dead code. The
      # projects existed the whole time; this line did not name them.
      - name: Axe and the acceptance surface
        run: pnpm test:e2e ${{ matrix.projects }}

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          # One name per shard, or the three uploads collide and only one
          # report survives — the one you did not need.
          name: playwright-report-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 7
